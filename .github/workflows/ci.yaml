name: CI frontend cine

on:
  push:
    branches: [main]

env:
  IMAGEN: ${{ secrets.DOCKER_USERNAME }}/frontend-cine:${{ github.sha }}

jobs:
  verificacion:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: instalar-node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: instalar-dependencias
        run: npm ci --legacy-peer-deps

      - name: verificar-tipos
        run: npm run typecheck

  docker:
    needs: verificacion
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: docker-build
        run: docker build --build-arg VITE_CINE_API_URL=http://localhost:3000/api/v1 -f ./Dockerfile -t ${{ env.IMAGEN }} .

      - name: inicio-sesion-docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: push-a-docker
        run: |
          docker push ${{ env.IMAGEN }}
          echo "Imagen del frontend subida a DockerHub: ${{ env.IMAGEN }}"